<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Form</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="name" id="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email"><br><br>
        <label for="num">Phone:</label>
        <input type="number" id="num" name="num"><br><br>
        <label for="date">Date of Birth</label>
        <input type="date" id="date" name="date"><br>
        <label for="gender">Gender</label>
        <input type="radio" id="gender" name="gender">
        <label for="gender">Male</label>
        <input type="radio" id="gender">
        <label for="Female">Female</label><br>

        <label for="country">Country</label>
        <select id="country" name="country">
            <option value="German">Germany</option>
            <option value="US">United States</option>
            <option value="Canada">Canada</option>
        </select><br>
        <fieldset>
           <legend>Address</legend>
           <label for="street">Street</label>
           <input type="street" id="street" name="street">
           <label for="street">City</label>
           <input type="street" id="street" name="street">
           <label for="num">Pincode</label>
           <input type="number" id="street" name="street">
        </fieldset>
        <fieldset>
            <legend>Other Information</legend>
            <label for="textarea1">Comments:</label>
            <textarea name="textarea1" id="textarea1" col="90" row="50"></textarea>
            <label for="agree">I agree to the terms of service</label>
            <input type="checkbox" id="agree">
        </fieldset>

    </fieldset>

    <button type="submit">Submit</button>
    </form>
</body>
</html>
